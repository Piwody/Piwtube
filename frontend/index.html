<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Plataforma de streaming de video">
  <title>PiwTube</title>
  <link rel="stylesheet" href="css/styles.css?v=3">
  <script type="module" src="js/home.js"></script>
</head>
<body>
  <header class="topbar">
    <a href="index.html" class="brand">
      <img class="brand__logo" src="img/logo.png" alt="" width="32" height="32">
      <span>PiwTube</span>
    </a>
    <form class="search" id="search-form" role="search" action="index.html">
      <label for="search" class="sr-only">Buscar videos</label>
      <input id="search" name="search" type="search" placeholder="Buscar videos…" autocomplete="off">
    </form>
  </header>

  <nav class="chips" id="chips" aria-label="Categorías"></nav>

  <main class="home">
    <section class="discover" aria-labelledby="discover-title">
      <div class="section-head">
        <h2 id="discover-title">Descubre</h2>
        <button id="shuffle" class="btn btn--ghost" type="button">
          <span aria-hidden="true">↻</span> Mezclar
        </button>
      </div>
      <div class="row__track" id="discover"></div>
    </section>

    <section class="catalog" aria-labelledby="catalog-title">
      <div class="section-head">
        <div>
          <h2 id="catalog-title">Catálogo</h2>
          <p id="status" class="status" role="status" aria-live="polite"></p>
        </div>
        <label class="sort">
          <span class="sr-only">Ordenar por</span>
          <select id="sort">
            <option value="recent">Más recientes</option>
            <option value="popular">Más vistos</option>
            <option value="title">A – Z</option>
          </select>
        </label>
      </div>
      <div class="grid" id="grid"></div>
    </section>
  </main>

  <footer class="footer">
    <p>PiwTube - Proyecto de Programación Web</p>
  </footer>
</body>
</html>
